services:
  # 1. API - Backend FastAPI
    - type: web
    name: faturaxpress-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
            - key: DATABASE_URL
        sync: false # <- tu vai colar a URL do Neon na mão no painel
            - key: SECRET_KEY
        generateValue: true
            - key: PYTHON_VERSION
        value: 3.11.9

  # 2. WEB - Painel Admin - Igual ao teu sige-ao
    - type: static
    name: faturaxpress-web
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
            - key: VITE_API_URL
        fromService:
          name: faturaxpress-api
          type: web
          property: url
    headers:
            - path: /*
        name: Cache-Control
        value: no-cache
    routes:
            - type: rewrite
        source: /*
        destination: /index.html
